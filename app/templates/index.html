<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI 驱动的 README.md 自动生成工具">
    <title>README 生成器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <noscript><p>此应用需要 JavaScript 才能运行，请启用 JavaScript 后刷新页面。</p></noscript>
    <main class="container">
        <hgroup>
            <h1>README 生成器 <button type="button" id="theme-toggle" class="theme-toggle" title="切换深色模式">&#9790;</button></h1>
            <p>AI 驱动的 README.md 自动生成工具，适用于任何项目</p>
        </hgroup>

        <!-- 输入区 -->
        <section id="input-section">
            <form id="analyze-form">
                <label for="folder-path">项目文件夹路径</label>
                <input type="text" id="folder-path" name="folder_path"
                       placeholder="C:\Users\...\my-project 或 /home/user/my-project" required>

                <div class="grid">
                    <div>
                        <label for="provider-select">AI 渠道
                            <button type="button" id="settings-btn" class="settings-icon" title="配置 API Key">&#9881;</button>
                        </label>
                        <select id="provider-select" name="provider">
                            <option value="">加载中...</option>
                        </select>
                    </div>
                    <div>
                        <label for="model-input">模型
                            <button type="button" id="refresh-models-btn" class="settings-icon" title="从 API 获取可用模型列表" style="display:none">&#8635;</button>
                        </label>
                        <input type="text" id="model-input" name="model" list="model-datalist"
                               placeholder="输入或选择模型" autocomplete="off">
                        <datalist id="model-datalist"></datalist>
                        <small id="model-hint" style="display:none;color:#e74c3c"></small>
                    </div>
                </div>

                <div id="key-status" class="key-status" style="display:none">
                    <small id="key-status-text"></small>
                </div>

                <div class="grid">
                    <button type="submit" id="generate-btn" class="contrast">生成 README</button>
                    <button type="button" id="test-btn" class="secondary outline">测试连接</button>
                    <button type="button" id="cancel-btn" class="secondary outline" style="display:none">取消生成</button>
                </div>
                <div id="test-status" class="test-status" style="display:none">
                    <small id="test-status-text"></small>
                </div>
            </form>
        </section>

        <!-- 进度区 -->
        <section id="progress-section" style="display:none">
            <div class="pipeline-steps" id="pipeline-steps">
                <div class="pipeline-step" data-step="validate">
                    <div class="step-icon"><span></span></div>
                    <div class="step-info">
                        <span class="step-label">校验路径</span>
                        <span class="step-detail"></span>
                    </div>
                </div>
                <div class="pipeline-step" data-step="read">
                    <div class="step-icon"><span></span></div>
                    <div class="step-info">
                        <span class="step-label">读取文件</span>
                        <span class="step-detail"></span>
                    </div>
                </div>
                <div class="pipeline-step" data-step="analyze">
                    <div class="step-icon"><span></span></div>
                    <div class="step-info">
                        <span class="step-label">AI 分析</span>
                        <span class="step-detail"></span>
                    </div>
                </div>
                <div class="pipeline-step" data-step="generate">
                    <div class="step-icon"><span></span></div>
                    <div class="step-info">
                        <span class="step-label">生成 README</span>
                        <span class="step-detail"></span>
                    </div>
                </div>
            </div>
            <div id="stream-stats" class="stream-stats" style="display:none">
                <span id="stat-chars">0 字符</span>
                <span class="stat-sep">|</span>
                <span id="stat-time">0s</span>
                <span class="stat-sep">|</span>
                <span id="stat-speed">0 字符/秒</span>
            </div>
        </section>

        <article id="error-section" style="display:none" class="error-card">
            <header>错误</header>
            <p id="error-message"></p>
            <footer><button id="error-dismiss-btn" class="secondary outline">关闭</button></footer>
        </article>

        <!-- 预览区 -->
        <section id="preview-section" style="display:none">
            <article>
                <header>
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="preview">预览</button>
                        <button class="tab-btn" data-tab="source">Markdown 源码</button>
                    </div>
                </header>

                <div id="tab-preview" class="tab-content active">
                    <div id="readme-preview" class="readme-body"></div>
                </div>

                <div id="tab-source" class="tab-content">
                    <div class="source-toolbar">
                        <button type="button" id="copy-btn" class="secondary outline small-btn">复制源码</button>
                    </div>
                    <textarea id="readme-source" rows="30" spellcheck="false"></textarea>
                </div>

                <footer>
                    <div class="feedback-bar">
                        <div class="feedback-chips">
                            <button type="button" class="chip" data-feedback="描述太长，精简一下">精简描述</button>
                            <button type="button" class="chip" data-feedback="加一个 API 文档章节">加 API 章节</button>
                            <button type="button" class="chip" data-feedback="语气更轻松友好">更友好</button>
                            <button type="button" class="chip" data-feedback="代码示例更详细一些">更多示例</button>
                            <button type="button" class="chip" data-feedback="添加中文翻译">加中文</button>
                            <button type="button" class="chip" data-feedback="去掉 Badge">去 Badge</button>
                        </div>
                        <textarea id="feedback-input" rows="2" placeholder="输入修改反馈，如：描述太长、加个 API 章节... (Enter 提交, Ctrl+Enter 换行)"></textarea>
                        <div class="feedback-actions">
                            <button id="feedback-btn" class="contrast">根据反馈重新生成</button>
                            <button id="download-btn">下载 README.md</button>
                            <button id="regenerate-btn" class="secondary outline">完全重新生成</button>
                        </div>
                    </div>
                </footer>
            </article>
        </section>

        <!-- 历史记录 -->
        <section id="history-section" style="display:none">
            <details class="settings-group">
                <summary class="settings-group-title">历史记录 <span id="history-count"></span></summary>
                <div id="history-list"></div>
            </details>
        </section>
    </main>

    <!-- 设置弹窗 -->
    <dialog id="settings-dialog">
        <article>
            <header>
                <div class="settings-tabs">
                    <button class="settings-tab active" data-stab="basic">基本设置</button>
                    <button class="settings-tab" data-stab="advanced">高级设置</button>
                    <button class="settings-tab" data-stab="apikey">API Key</button>
                </div>
            </header>

            <div id="stab-basic" class="settings-tab-content active">
                <div class="settings-row">
                    <div>
                        <label for="setting-language">README 语言</label>
                        <select id="setting-language">
                            <option value="zh">中文</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <div>
                        <label for="setting-tone">语气风格</label>
                        <select id="setting-tone">
                            <option value="professional">专业正式</option>
                            <option value="casual">轻松友好</option>
                            <option value="technical">高度技术</option>
                        </select>
                    </div>
                </div>
                <div class="settings-row">
                    <div class="slider-wrap">
                        <label for="setting-temperature">温度 <output id="temp-value">0.7</output></label>
                        <input type="range" id="setting-temperature" min="0" max="2" step="0.1" value="0.7">
                    </div>
                    <div class="checkbox-wrap">
                        <label for="setting-badges">
                            <input type="checkbox" id="setting-badges" role="switch" checked>
                            生成 Badge
                        </label>
                    </div>
                </div>
                <div class="settings-row">
                    <div>
                        <label for="setting-badge-style">Badge 样式</label>
                        <select id="setting-badge-style">
                            <option value="shields">Shields.io</option>
                            <option value="shields-flat">Shields Flat</option>
                            <option value="badgen">Badgen</option>
                        </select>
                    </div>
                    <div>
                        <label for="setting-code-examples">代码示例</label>
                        <select id="setting-code-examples">
                            <option value="minimal">简洁</option>
                            <option value="normal" selected>适中</option>
                            <option value="detailed">详细</option>
                        </select>
                    </div>
                </div>
                <div class="settings-row">
                    <div class="slider-wrap">
                        <label for="setting-toc-depth">目录深度 <output id="toc-value">2</output></label>
                        <input type="range" id="setting-toc-depth" min="1" max="4" step="1" value="2">
                    </div>
                    <div>
                        <label for="setting-audience">目标受众</label>
                        <select id="setting-audience">
                            <option value="developer">开发者</option>
                            <option value="user">终端用户</option>
                            <option value="contributor">贡献者</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="stab-advanced" class="settings-tab-content">
                <div class="settings-row">
                    <div>
                        <label for="setting-max-analyze">分析 max_tokens</label>
                        <input type="number" id="setting-max-analyze" min="4096" max="131072" step="1024" value="16384">
                    </div>
                    <div>
                        <label for="setting-max-generate">生成 max_tokens</label>
                        <input type="number" id="setting-max-generate" min="4096" max="131072" step="1024" value="32768">
                    </div>
                </div>
                <div class="settings-row">
                    <div>
                        <label for="setting-custom-sections">自定义章节</label>
                        <input type="text" id="setting-custom-sections" placeholder="如: FAQ,Changelog">
                    </div>
                    <div>
                        <label for="setting-exclude-sections">排除章节</label>
                        <input type="text" id="setting-exclude-sections" placeholder="如: License,Badges">
                    </div>
                </div>
                <div class="settings-row">
                    <div>
                        <label for="setting-include-patterns">包含文件</label>
                        <input type="text" id="setting-include-patterns" placeholder="*.py,*.js">
                    </div>
                    <div>
                        <label for="setting-exclude-patterns">排除文件</label>
                        <input type="text" id="setting-exclude-patterns" placeholder="*.test.js,vendor/*">
                    </div>
                </div>
                <div class="settings-row">
                    <div>
                        <label for="setting-section-order">章节顺序</label>
                        <input type="text" id="setting-section-order" placeholder="如: 安装,使用,架构,许可证">
                    </div>
                    <div>
                        <label for="setting-link-style">链接样式</label>
                        <select id="setting-link-style">
                            <option value="inline">行内式</option>
                            <option value="reference">引用式</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label for="setting-custom-prompt">自定义 Prompt</label>
                    <textarea id="setting-custom-prompt" rows="2" placeholder="在生成指令末尾追加的内容..." style="font-size:0.85rem"></textarea>
                </div>
            </div>

            <div id="stab-apikey" class="settings-tab-content">
                <input type="text" id="provider-search" placeholder="搜索渠道..." style="margin-bottom:0.5rem;font-size:0.85rem">
                <div id="settings-body"></div>
            </div>

            <footer>
                <div class="grid">
                    <button id="settings-save-btn" class="contrast">保存</button>
                    <button id="settings-close-btn" class="secondary outline">取消</button>
                </div>
            </footer>
        </article>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.4/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
